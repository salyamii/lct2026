# OpenAPI 3.1 external schema components. Source: domain/backend and domain/analytics Kotlin DTOs.
components:
  schemas:
    AnalyticsMode:
      type: "string"
      enum:
        - "REAL"
        - "DEMO"
        - "SIMULATION"
    AnalyticsActor:
      type: "string"
      enum:
        - "CHILD"
        - "SYSTEM"
        - "PARENT"
    LearningContext:
      type: "string"
      enum:
        - "GAME"
        - "COUNTERFACTUAL"
        - "TRAINING"
    Assistance:
      type: "string"
      enum:
        - "INFORMATION_ONLY"
        - "HINT"
        - "WORKED_EXAMPLE"
        - "ANSWER_REVEALED"
        - "ADULT_REPORTED"
    FundingSource:
      type: "string"
      enum:
        - "CONFIRMED_SAVINGS_WITHDRAWAL"
        - "GUARANTEED_INCOME"
    BudgetRevisionCause:
      type: "string"
      enum:
        - "INITIAL"
        - "KNOWN_NEED_OMITTED"
        - "UNEXPECTED_EXPENSE"
        - "NEW_INCOME"
        - "UNSPECIFIED"
    SavingMovementKind:
      type: "string"
      enum:
        - "DEPOSIT"
        - "WITHDRAWAL"
        - "GOAL_PURCHASE"
    QuestionPurpose:
      type: "string"
      enum:
        - "COMPARE_AMOUNTS"
        - "EXPLAIN_CAUSE"
        - "READ_LEDGER"
    PracticeKind:
      type: "string"
      enum:
        - "PLAN_REVIEW"
        - "SAVINGS_REHEARSAL"
    ComparisonSide:
      type: "string"
      enum:
        - "LEFT"
        - "RIGHT"
        - "EQUAL"
    LedgerQuestion:
      type: "string"
      enum:
        - "INCOME"
        - "EXPENSE"
        - "DEPOSIT"
        - "WITHDRAWAL"
        - "AVAILABLE_REMAINDER"
        - "SAVINGS_REMAINDER"
    TimeMachineLifecycleEvent:
      type: "string"
      enum:
        - "time_machine_simulation_started"
        - "time_machine_simulation_completed"
        - "time_machine_simulation_diverged"
        - "time_machine_simulation_unavailable"
        - "time_machine_question_presented"
        - "time_machine_explanation_shown"
    LedgerKind:
      type: "string"
      enum:
        - "INCOME"
        - "AVAILABLE_EXPENSE"
        - "SAVINGS_EXPENSE"
        - "DEPOSIT"
        - "WITHDRAWAL"
    AnalyticsFact:
      type: "object"
      additionalProperties: false
      properties:
        eventId:
          type: "string"
          pattern: "\\S"
        gameRunId:
          type: "string"
          pattern: "\\S"
        episodeId:
          type: "string"
          pattern: "\\S"
        actionId:
          type: "string"
          pattern: "\\S"
        sequence:
          type: "integer"
          format: "int64"
          minimum: 0
        detail:
          $ref: "#/components/schemas/FactDetail"
        context:
          $ref: "#/components/schemas/DecisionContext"
          default: {}
        mode:
          $ref: "#/components/schemas/AnalyticsMode"
          default: "REAL"
        actor:
          $ref: "#/components/schemas/AnalyticsActor"
          default: "CHILD"
        learningContext:
          $ref: "#/components/schemas/LearningContext"
          default: "GAME"
        contextFamily:
          type: "string"
          default: "unspecified"
          pattern: "\\S"
        contentVersion:
          type: "string"
          default: "1"
          pattern: "\\S"
        gameRulesVersion:
          type: "string"
          default: "1"
          pattern: "\\S"
        schemaVersion:
          type: "integer"
          format: "int32"
          default: 1
          minimum: 1
      required:
        - "eventId"
        - "gameRunId"
        - "episodeId"
        - "actionId"
        - "sequence"
        - "detail"
      description: "Committed source or reconstructed interval fact. JSON discriminator is _type. Derived facts are versioned projections, not additional child actions."
    FinancialPosition:
      type: "object"
      additionalProperties: false
      properties:
        available:
          type: "integer"
          format: "int64"
          minimum: 0
        savings:
          type: "integer"
          format: "int64"
          minimum: 0
        knownNeeds:
          type: "integer"
          format: "int64"
          minimum: 0
      required:
        - "available"
        - "savings"
        - "knownNeeds"
    DecisionContext:
      type: "object"
      additionalProperties: false
      properties:
        presentationId:
          anyOf:
            -
              type: "string"
            -
              type: "null"
          default: null
        informationPresented:
          type: "boolean"
          default: false
        complete:
          type: "boolean"
          default: false
        before:
          anyOf:
            -
              $ref: "#/components/schemas/FinancialPosition"
            -
              type: "null"
          default: null
        after:
          anyOf:
            -
              $ref: "#/components/schemas/FinancialPosition"
            -
              type: "null"
          default: null
        alternativeAvailable:
          anyOf:
            -
              type: "boolean"
            -
              type: "null"
          default: null
        fundingPlan:
          anyOf:
            -
              $ref: "#/components/schemas/FundingPlan"
            -
              type: "null"
          default: null
        assistance:
          type: "array"
          items:
            $ref: "#/components/schemas/Assistance"
          uniqueItems: true
          default: []
        adultHelpKnown:
          type: "boolean"
          default: false
        financialPeriodId:
          anyOf:
            -
              type: "string"
            -
              type: "null"
          default: null
        day:
          anyOf:
            -
              type: "integer"
              format: "int32"
              minimum: 1
            -
              type: "null"
          default: null
    FundingPlan:
      type: "object"
      additionalProperties: false
      properties:
        id:
          type: "string"
          pattern: "\\S"
        amount:
          type: "integer"
          format: "int64"
          minimum: 0
        selected:
          type: "boolean"
        feasibleBeforeNeed:
          type: "boolean"
        guaranteedAmount:
          type: "boolean"
        source:
          $ref: "#/components/schemas/FundingSource"
      required:
        - "id"
        - "amount"
        - "selected"
        - "feasibleBeforeNeed"
        - "guaranteedAmount"
        - "source"
    Interaction:
      type: "object"
      additionalProperties: false
      properties:
        _type:
          type: "string"
          const: "interaction"
        name:
          type: "string"
      required:
        - "_type"
        - "name"
    TimeMachineLifecycle:
      type: "object"
      additionalProperties: false
      properties:
        _type:
          type: "string"
          const: "time_machine_lifecycle"
        event:
          $ref: "#/components/schemas/TimeMachineLifecycleEvent"
        simulationId:
          type: "string"
          pattern: "\\S"
        resultHash:
          type: "string"
          pattern: "\\S"
        sourceEntryId:
          type: "string"
          pattern: "\\S"
        requestedSequence:
          type: "integer"
          format: "int64"
          minimum: 1
        reachedSequence:
          type: "integer"
          format: "int64"
          minimum: 0
        status:
          type: "string"
          pattern: "\\S"
        questionId:
          anyOf:
            -
              type: "string"
            -
              type: "null"
          default: null
        submissionId:
          anyOf:
            -
              type: "string"
            -
              type: "null"
          default: null
        attempt:
          anyOf:
            -
              type: "integer"
              format: "int32"
              minimum: 1
            -
              type: "null"
          default: null
      required:
        - "_type"
        - "event"
        - "simulationId"
        - "resultHash"
        - "sourceEntryId"
        - "requestedSequence"
        - "reachedSequence"
        - "status"
      description: "reachedSequence must not exceed requestedSequence. Lifecycle provenance alone is not skill success."
    PracticeAnswer:
      type: "object"
      additionalProperties: false
      properties:
        _type:
          type: "string"
          const: "practice_answer"
        questionId:
          type: "string"
          pattern: "\\S"
        kind:
          $ref: "#/components/schemas/PracticeKind"
        selectedAnswerId:
          type: "string"
          pattern: "\\S"
        expectedAnswerId:
          type: "string"
          pattern: "\\S"
        attempt:
          type: "integer"
          format: "int32"
          minimum: 1
        guidedRecovery:
          type: "boolean"
      required:
        - "_type"
        - "questionId"
        - "kind"
        - "selectedAnswerId"
        - "expectedAnswerId"
        - "attempt"
        - "guidedRecovery"
    BudgetConfirmed:
      type: "object"
      additionalProperties: false
      properties:
        _type:
          type: "string"
          const: "budget_confirmed"
        planId:
          type: "string"
          pattern: "\\S"
        planVersion:
          type: "integer"
          format: "int32"
          minimum: 1
        allocationBase:
          type: "integer"
          format: "int64"
          minimum: 0
        needs:
          type: "integer"
          format: "int64"
          minimum: 0
        wants:
          type: "integer"
          format: "int64"
          minimum: 0
        savings:
          type: "integer"
          format: "int64"
          minimum: 0
        reserve:
          type: "integer"
          format: "int64"
          minimum: 0
        cause:
          $ref: "#/components/schemas/BudgetRevisionCause"
      required:
        - "_type"
        - "planId"
        - "planVersion"
        - "allocationBase"
        - "needs"
        - "wants"
        - "savings"
        - "reserve"
        - "cause"
    OptionalPurchase:
      type: "object"
      additionalProperties: false
      properties:
        _type:
          type: "string"
          const: "optional_purchase"
        itemId:
          type: "string"
          pattern: "\\S"
        price:
          type: "integer"
          format: "int64"
          minimum: 0
        purchased:
          type: "boolean"
      required:
        - "_type"
        - "itemId"
        - "price"
        - "purchased"
    IncomeWindow:
      type: "object"
      additionalProperties: false
      properties:
        _type:
          type: "string"
          const: "income_window"
        windowId:
          type: "string"
        closed:
          type: "boolean"
        historyComplete:
          type: "boolean"
        managedDecisionIds:
          type: "array"
          items:
            type: "string"
        knownNeedsMet:
          type: "boolean"
        avoidableUncoveredNeedIds:
          type: "array"
          items:
            type: "string"
          default: []
        availableRemedyWasShown:
          type: "boolean"
          default: false
      required:
        - "_type"
        - "windowId"
        - "closed"
        - "historyComplete"
        - "managedDecisionIds"
        - "knownNeedsMet"
    SavingMovement:
      type: "object"
      additionalProperties: false
      properties:
        _type:
          type: "string"
          const: "saving_movement"
        operationId:
          type: "string"
          pattern: "\\S"
        goalId:
          type: "string"
          pattern: "\\S"
        incomeWindowId:
          type: "string"
          pattern: "\\S"
        kind:
          $ref: "#/components/schemas/SavingMovementKind"
        amount:
          type: "integer"
          format: "int64"
          minimum: 1
      required:
        - "_type"
        - "operationId"
        - "goalId"
        - "incomeWindowId"
        - "kind"
        - "amount"
    SavingCycleClosed:
      type: "object"
      additionalProperties: false
      properties:
        _type:
          type: "string"
          const: "saving_cycle_closed"
        goalId:
          type: "string"
        historyComplete:
          type: "boolean"
      required:
        - "_type"
        - "goalId"
        - "historyComplete"
    SavingIntentionResolved:
      type: "object"
      additionalProperties: false
      properties:
        _type:
          type: "string"
          const: "saving_intention_resolved"
        goalId:
          type: "string"
          pattern: "\\S"
        opportunityId:
          type: "string"
          pattern: "\\S"
        promisedAmount:
          type: "integer"
          format: "int64"
          minimum: 1
        depositedAmount:
          type: "integer"
          format: "int64"
          minimum: 0
        priorityUnchanged:
          type: "boolean"
        deliberatelySkipped:
          type: "boolean"
      required:
        - "_type"
        - "goalId"
        - "opportunityId"
        - "promisedAmount"
        - "depositedAmount"
        - "priorityUnchanged"
        - "deliberatelySkipped"
    DesireDeferred:
      type: "object"
      additionalProperties: false
      properties:
        _type:
          type: "string"
          const: "desire_deferred"
        itemId:
          type: "string"
          pattern: "\\S"
        price:
          type: "integer"
          format: "int64"
          minimum: 0
        desireDeclared:
          type: "boolean"
        priorityId:
          anyOf:
            -
              type: "string"
            -
              type: "null"
      required:
        - "_type"
        - "itemId"
        - "price"
        - "desireDeclared"
        - "priorityId"
    PriorityApplied:
      type: "object"
      additionalProperties: false
      properties:
        _type:
          type: "string"
          const: "priority_applied"
        priorityId:
          type: "string"
          pattern: "\\S"
        operationId:
          type: "string"
          pattern: "\\S"
        amount:
          type: "integer"
          format: "int64"
          minimum: 1
      required:
        - "_type"
        - "priorityId"
        - "operationId"
        - "amount"
    PriorityConflict:
      type: "object"
      additionalProperties: false
      properties:
        _type:
          type: "string"
          const: "priority_conflict"
        priorityId:
          type: "string"
        conditionsUnchanged:
          type: "boolean"
        alternativePreservedPriority:
          type: "boolean"
        explanation:
          anyOf:
            -
              $ref: "#/components/schemas/ExplainCause"
            -
              type: "null"
      required:
        - "_type"
        - "priorityId"
        - "conditionsUnchanged"
        - "alternativePreservedPriority"
        - "explanation"
    ReserveDecision:
      type: "object"
      additionalProperties: false
      properties:
        _type:
          type: "string"
          const: "reserve_decision"
        intentionId:
          type: "string"
        declaredAmount:
          type: "integer"
          format: "int64"
          minimum: 0
        remainingAmount:
          type: "integer"
          format: "int64"
          minimum: 0
        usedForUnexpectedExpense:
          type: "integer"
          format: "int64"
          minimum: 0
        intervalClosed:
          type: "boolean"
        applications:
          type: "array"
          items:
            $ref: "#/components/schemas/ReserveApplication"
          default: []
      required:
        - "_type"
        - "intentionId"
        - "declaredAmount"
        - "remainingAmount"
        - "usedForUnexpectedExpense"
        - "intervalClosed"
    UnexpectedExpense:
      type: "object"
      additionalProperties: false
      properties:
        _type:
          type: "string"
          const: "unexpected_expense"
        operationId:
          type: "string"
          pattern: "\\S"
        amount:
          type: "integer"
          format: "int64"
          minimum: 1
        previouslyDisclosed:
          type: "boolean"
      required:
        - "_type"
        - "operationId"
        - "amount"
        - "previouslyDisclosed"
    RecoveryAction:
      type: "object"
      additionalProperties: false
      properties:
        _type:
          type: "string"
          const: "recovery_action"
        expenseOperationId:
          type: "string"
        selectedActionId:
          type: "string"
        completed:
          type: "boolean"
      required:
        - "_type"
        - "expenseOperationId"
        - "selectedActionId"
        - "completed"
    ResourceChoice:
      type: "object"
      additionalProperties: false
      properties:
        _type:
          type: "string"
          const: "resource_choice"
        chosenOptionId:
          type: "string"
        chosenCost:
          $ref: "#/components/schemas/ResourceCost"
        alternativeCost:
          $ref: "#/components/schemas/ResourceCost"
        energyBefore:
          type: "integer"
          format: "int32"
          minimum: 0
        availableTimeBefore:
          type: "integer"
          format: "int32"
          minimum: 0
        priorityId:
          anyOf:
            -
              type: "string"
            -
              type: "null"
        priorityMoney:
          type: "integer"
          format: "int64"
          minimum: 0
        priorityEnergy:
          type: "integer"
          format: "int32"
          minimum: 0
        priorityTime:
          type: "integer"
          format: "int32"
          minimum: 0
        chosenPriorityFeasible:
          anyOf:
            -
              type: "boolean"
            -
              type: "null"
          default: null
        alternativePriorityFeasible:
          anyOf:
            -
              type: "boolean"
            -
              type: "null"
          default: null
      required:
        - "_type"
        - "chosenOptionId"
        - "chosenCost"
        - "alternativeCost"
        - "energyBefore"
        - "availableTimeBefore"
        - "priorityId"
        - "priorityMoney"
        - "priorityEnergy"
        - "priorityTime"
    EarningPlan:
      type: "object"
      additionalProperties: false
      properties:
        _type:
          type: "string"
          const: "earning_plan"
        offerId:
          type: "string"
        priorityId:
          anyOf:
            -
              type: "string"
            -
              type: "null"
        startedDay:
          type: "integer"
          format: "int32"
          minimum: 1
        deadlineDay:
          type: "integer"
          format: "int32"
          minimum: 1
        effortRequired:
          type: "integer"
          format: "int32"
          minimum: 0
        availableEffortAtChoice:
          type: "integer"
          format: "int32"
          minimum: 0
        maximumReward:
          type: "integer"
          format: "int64"
          minimum: 0
      required:
        - "_type"
        - "offerId"
        - "priorityId"
        - "startedDay"
        - "deadlineDay"
        - "effortRequired"
        - "availableEffortAtChoice"
        - "maximumReward"
    EarningCompleted:
      type: "object"
      additionalProperties: false
      properties:
        _type:
          type: "string"
          const: "earning_completed"
        offerId:
          type: "string"
        day:
          type: "integer"
          format: "int32"
          minimum: 1
        actualReward:
          type: "integer"
          format: "int64"
          minimum: 0
        actualRewardAccountedFor:
          type: "boolean"
      required:
        - "_type"
        - "offerId"
        - "day"
        - "actualReward"
        - "actualRewardAccountedFor"
    QuestionAnswer:
      type: "object"
      additionalProperties: false
      properties:
        _type:
          type: "string"
          const: "question_answer"
        questionId:
          type: "string"
          pattern: "\\S"
        attempt:
          type: "integer"
          format: "int32"
          minimum: 1
        task:
          $ref: "#/components/schemas/AssessmentTask"
        answerWasRevealed:
          type: "boolean"
          default: false
        seriesClosed:
          type: "boolean"
          default: true
        comparisonFamily:
          anyOf:
            -
              type: "string"
            -
              type: "null"
          default: null
        simulationId:
          anyOf:
            -
              type: "string"
            -
              type: "null"
          default: null
      required:
        - "_type"
        - "questionId"
        - "attempt"
        - "task"
    ComparableApplication:
      type: "object"
      additionalProperties: false
      properties:
        _type:
          type: "string"
          const: "comparable_application"
        comparisonFamily:
          type: "string"
        sourceActionId:
          type: "string"
        priorityPreserved:
          type: "boolean"
      required:
        - "_type"
        - "comparisonFamily"
        - "sourceActionId"
        - "priorityPreserved"
    ReserveApplication:
      type: "object"
      additionalProperties: false
      properties:
        expenseOperationId:
          type: "string"
          pattern: "\\S"
        amount:
          type: "integer"
          format: "int64"
          minimum: 1
      required:
        - "expenseOperationId"
        - "amount"
    ResourceCost:
      type: "object"
      additionalProperties: false
      properties:
        money:
          type: "integer"
          format: "int64"
          minimum: 0
        energy:
          type: "integer"
          format: "int32"
          minimum: 0
        time:
          type: "integer"
          format: "int32"
          minimum: 0
      required:
        - "money"
        - "energy"
        - "time"
    CompareAmounts:
      type: "object"
      additionalProperties: false
      properties:
        _type:
          type: "string"
          const: "compare_amounts"
        left:
          type: "integer"
          format: "int64"
          minimum: 0
        right:
          type: "integer"
          format: "int64"
          minimum: 0
        chosen:
          $ref: "#/components/schemas/ComparisonSide"
        purpose:
          type: "string"
          const: "COMPARE_AMOUNTS"
          default: "COMPARE_AMOUNTS"
      required:
        - "_type"
        - "left"
        - "right"
        - "chosen"
    ExplainCause:
      type: "object"
      additionalProperties: false
      properties:
        _type:
          type: "string"
          const: "explain_cause"
        expectedOptionId:
          type: "string"
          pattern: "\\S"
        chosenOptionId:
          type: "string"
          pattern: "\\S"
        sourceFactIds:
          type: "array"
          items:
            type: "string"
          minItems: 1
        purpose:
          type: "string"
          const: "EXPLAIN_CAUSE"
          default: "EXPLAIN_CAUSE"
      required:
        - "_type"
        - "expectedOptionId"
        - "chosenOptionId"
        - "sourceFactIds"
    ReadLedger:
      type: "object"
      additionalProperties: false
      properties:
        _type:
          type: "string"
          const: "read_ledger"
        openingAvailable:
          type: "integer"
          format: "int64"
          minimum: 0
        openingSavings:
          type: "integer"
          format: "int64"
          minimum: 0
        entries:
          type: "array"
          items:
            $ref: "#/components/schemas/LedgerEntry"
        question:
          $ref: "#/components/schemas/LedgerQuestion"
        answer:
          type: "integer"
          format: "int64"
        purpose:
          type: "string"
          const: "READ_LEDGER"
          default: "READ_LEDGER"
      required:
        - "_type"
        - "openingAvailable"
        - "openingSavings"
        - "entries"
        - "question"
        - "answer"
    LedgerEntry:
      type: "object"
      additionalProperties: false
      properties:
        operationId:
          type: "string"
          pattern: "\\S"
        kind:
          $ref: "#/components/schemas/LedgerKind"
        amount:
          type: "integer"
          format: "int64"
          minimum: 0
      required:
        - "operationId"
        - "kind"
        - "amount"
    ObservationOutcome:
      type: "string"
      enum:
        - "SUPPORTED"
        - "DIFFICULTY"
        - "NEUTRAL"
        - "INSUFFICIENT_DATA"
    ObservationEligibility:
      type: "string"
      enum:
        - "ELIGIBLE"
        - "NOT_ELIGIBLE"
        - "UNDETERMINED"
    EpisodeCompletion:
      type: "string"
      enum:
        - "COMPLETE"
        - "PENDING"
    ObservationReason:
      type: "string"
      enum:
        - "CONTEXT_MISSING"
        - "PRESENTATION_MISSING"
        - "INVALID_CONTEXT"
        - "EPISODE_PENDING"
        - "CORRECT_COMPARISON"
        - "INCORRECT_COMPARISON"
        - "VALID_PLAN"
        - "KNOWN_NEED_OMITTED"
        - "ORIGINAL_SHORTFALL"
        - "INFEASIBLE_ALLOCATION"
        - "UNKNOWN_REVISION_CAUSE"
        - "NEEDS_COVERED"
        - "AVOIDABLE_NEEDS_GAP"
