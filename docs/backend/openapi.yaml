openapi: 3.1.0
info:
  title: LCT device profile, world backup, financial analytics and parent rewards
  version: 1.0.0-proposal
  description: Backend handoff dated 2026-09-27. Every child request identifies the saved deviceId in its JSON body.
    New Android identities use AndroidID; migrated clients preserve the previously saved UUID. The offline QR is exactly
    that raw string, without a URL or expiry. All seven child operations are wired in Android; live server compatibility
    remains unverified. The existing parent-only GET /api/parents/{petId} uses petId=deviceId and is not called by
    the child. The parent reward creation operation is an implementation proposal for the parent client. No automatic
    local archive restore or cross-device merge is performed. New known accessories are supported; coin rewards and
    duplicate accessories remain pending product policy. See README.md, client-sync.md, parent-rewards.md, world-snapshot.md
    and analytics.md.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
x-contract-date: '2026-09-27'
servers:
- url: https://fin-api.mortypython.ru/
  description: Team-provided endpoint; API compatibility pending verification
x-proposed-limits:
  status: Negotiable server policy; not enforced by Android DTOs
  decompressedSnapshotRequestBytes: 26214400
  decompressedAnalyticsRequestBytes: 10485760
  minimumIdempotencyRetentionSeconds: 604800
  registrationBodyBytes: 16384
paths:
  /api/pets:
    post:
      operationId: registerProfile
      summary: Register a profile and pet
      description: Register the supplied deviceId and pet, returning the same deviceId. The body stays frozen until
        a matching response. Re-registration of an existing deviceId preserves its snapshots, analytics and rewards;
        it is not an implicit pet edit or profile reset. Current pet state is delivered by snapshots. Idempotency-Key
        protects retries of the same registration intent.
      tags:
      - Profiles
      x-implementation-status: android-transport-contract; server-proposed
      responses:
        '200':
          description: Committed result; an identical idempotent replay returns the same result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterProfileResponse'
        '201':
          description: Committed result; an identical idempotent replay returns the same result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Unavailable'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterProfileRequest'
  /v1/profiles/snapshot:
    put:
      operationId: uploadSnapshot
      summary: Store the complete game archive
      description: Idempotency-Key must equal uploadId. Compare expectedServerRevision atomically; null means no existing
        save. Validate envelope metadata against snapshotJson. Persist the entire archive before publishing a new
        serverRevision. Same upload does not increase the revision. A new gameRunId is allowed when snapshot format 5
        contains the current server run in archivedRuns and its nextRunId chain ends at the uploaded run; the archived
        history must preserve the server history prefix. Otherwise return GAME_RUN_CONFLICT. Keep snapshotJson unchanged. After long offline periods a 409 conflict
        preserves the current local world, reward receipts and outbox. Do not download-and-overwrite automatically,
        bypass compare-and-swap with a guessed revision or merge balances using timestamps.
      tags:
      - World snapshots
      x-implementation-status: android-transport-contract; server-proposed
      responses:
        '200':
          description: Committed result; an identical idempotent replay returns the same result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotUploadResponse'
        '201':
          description: Committed result; an identical idempotent replay returns the same result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotUploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Unavailable'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnapshotUploadRequest'
  /v1/profiles/snapshot/download:
    post:
      operationId: downloadSnapshot
      summary: Download the latest accepted archive
      description: Returns an opaque full-world archive. Download alone never restores or overwrites the local game.
        Restore requires checksum/compatibility validation and an explicit local RestoreGuard.
      tags:
      - World snapshots
      x-implementation-status: android-transport-contract; server-proposed
      responses:
        '200':
          description: Requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotDownloadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Unavailable'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnapshotDownloadRequest'
  /v1/profiles/analytics:
    post:
      operationId: uploadAnalytics
      summary: Upload full skill evidence at an audit boundary
      description: Idempotency-Key must equal batchId. This is the complete projection through throughHistorySequence,
        not counter increments. Original facts are immutable; versioned derived facts may be refined at later boundaries.
        Accepted facts and mastery assessments are separate. See analytics.md for deduplication and projection rules.
      tags:
      - Analytics
      x-implementation-status: android-transport-contract; server-proposed
      responses:
        '200':
          description: Committed result; an identical idempotent replay returns the same result.
          content:
            application/json:
              schema:
                $ref: ./analytics.openapi.yaml#/components/schemas/AnalyticsUploadResponse
        '201':
          description: Committed result; an identical idempotent replay returns the same result.
          content:
            application/json:
              schema:
                $ref: ./analytics.openapi.yaml#/components/schemas/AnalyticsUploadResponse
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Unavailable'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./analytics.openapi.yaml#/components/schemas/AnalyticsUploadRequest
  /v1/profiles/skills/query:
    post:
      operationId: getSkillAssessments
      summary: Read server assessments of all 12 skills
      description: Exactly one FIN-01 through FIN-12 entry. Backend owns versioned mastery policy. A missing policy/assessment
        returns 409 ASSESSMENT_NOT_READY, not fabricated NO_DATA. basedOnHistorySequence states how current the result
        is.
      tags:
      - Analytics
      x-implementation-status: android-transport-contract; server-proposed
      responses:
        '200':
          description: Requested resource.
          content:
            application/json:
              schema:
                $ref: ./analytics.openapi.yaml#/components/schemas/SkillAssessmentsResponse
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Unavailable'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillAssessmentsRequest'
  /v1/profiles/rewards/pull:
    post:
      operationId: listParentRewards
      summary: Read the replayable reward journal
      description: Read the immutable per-(deviceId, gameRunId) reward ledger, including grants already acknowledged.
        Request fields are in JSON, not the URL. Return contiguous sequence values strictly after afterSequence; nextAfterSequence
        is the last returned value or the request cursor when empty. Empty pages have hasMore=false. limit is 1..100,
        default 50. Out-of-range cursor is INVALID_REWARD_CURSOR. The page cursor is not proof of local application.
        Android persists a download hint bound to deviceId, gameRunId and the local restore generation; a restore
        invalidates it. Reward effects and full receipts commit atomically against the latest local world, then ACK
        may be sent. Unknown/deferred rewards do not block later supported rewards and are revisited on the next complete
        scan.
      tags:
      - Parent rewards
      x-implementation-status: android-client-wired; live-server-compatibility-unverified
      responses:
        '200':
          description: Result or identical idempotent replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParentRewardsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Unavailable'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PullParentRewardsRequest'
  /v1/profiles/rewards/ack:
    post:
      operationId: acknowledgeParentRewards
      summary: Acknowledge committed local reward applications
      description: Send only after atomic local commit of latest-world change, full immutable grant receipt, audit
        and outbox, with the current run checked in that same transaction. Receipt identity is applicationId and its
        payload is immutable. Existing receipt reuses its applicationId. The same rewardId may have a different application
        after old-snapshot restore; never impose global receipt uniqueness by rewardId. ACK loss causes identical
        retry, not duplicate effect. ACK never deletes a grant, proves cloud backup or filters later pull responses. Wrong-run grants
        receive no ACK. Retry the same frozen body/key; changed receipt payload returns REWARD_RECEIPT_CONFLICT.
      tags:
      - Parent rewards
      x-implementation-status: android-client-wired; live-server-compatibility-unverified
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Result or identical idempotent replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckParentRewardsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Unavailable'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AckParentRewardsRequest'
  /v1/parent-profiles/rewards:
    post:
      operationId: createParentReward
      summary: Parent grants coins or an accessory
      description: Parent-client proposal. Create one immutable grant for the deviceId and gameRunId in JSON. The
        run must already exist from a verified snapshot, otherwise GAME_RUN_NOT_REGISTERED. Keep the business identity
        (deviceId, Idempotency-Key) for the lifetime of the ledger, even after an HTTP replay cache expires. Same
        key with different body or run is IDEMPOTENCY_CONFLICT. Generate rewardId and the next contiguous sequence
        atomically. Issued rewards do not expire during offline periods. Allowed accessory IDs and coin/duplicate
        policies remain to be agreed; current Android applies only new known accessories. The child client does not
        call this operation.
      tags:
      - Parent rewards
      x-implementation-status: parent-endpoint-proposal; shared Android DTO only
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Result or identical idempotent replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParentRewardDto'
        '201':
          description: Result or identical idempotent replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParentRewardDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Unavailable'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateParentRewardRequest'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
      description: Stable replay key for one frozen request, preferably UUID. Bound to deviceId, method, path and
        body. Same key with a changed body is 409. Equals uploadId or batchId when present. It is only duplicate-operation
        protection.
  responses:
    BadRequest:
      description: Invalid request shape.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BackendError'
          example:
            code: INVALID_REQUEST
            requestId: req-123
    NotFound:
      description: Requested profile or snapshot does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BackendError'
          example:
            code: SNAPSHOT_NOT_FOUND
            requestId: req-123
    Conflict:
      description: Idempotency, snapshot revision, unregistered/mismatched game run, reward receipt, immutable fact,
        stale analytics or assessment readiness conflict. See code.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BackendError'
          example:
            code: IDEMPOTENCY_CONFLICT
            requestId: req-123
    TooLarge:
      description: Request exceeds the negotiated decompressed body limit; do not truncate history.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BackendError'
          example:
            code: PAYLOAD_TOO_LARGE
            requestId: req-123
    Unprocessable:
      description: Unsupported schema, invalid snapshot integrity, blank device ID, invalid reward amount/accessory,
        cursor or receipt.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BackendError'
          example:
            code: UNSUPPORTED_SCHEMA
            requestId: req-123
    RateLimited:
      description: Rate limit exceeded; retry the same immutable request after Retry-After.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BackendError'
          example:
            code: RATE_LIMITED
            requestId: req-123
      headers:
        Retry-After:
          required: true
          description: Delay in seconds or HTTP-date.
          schema:
            type: string
    Unavailable:
      description: Temporary server failure; commit may have succeeded. Retry the same idempotency key and body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BackendError'
          example:
            code: TEMPORARILY_UNAVAILABLE
            requestId: req-123
  schemas:
    RegisteredPetDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: Nonblank, single-line name; no control characters.
        age:
          type: string
          enum:
          - CUB
          - TEEN
          - ADULT
          - SENIOR
        color:
          type: string
          enum:
          - COPPER
          - SAND
          - DARK_RUSSET
        temperament:
          anyOf:
          - type: string
            enum:
            - Curious
            - Confident
            - Joyful
          - type: 'null'
        selectedLookId:
          type: string
          minLength: 1
      required:
      - name
      - age
      - color
      - temperament
      - selectedLookId
    RegisterProfileRequest:
      type: object
      properties:
        deviceId:
          $ref: '#/components/schemas/DeviceId'
        pet:
          $ref: '#/components/schemas/RegisteredPetDto'
        schemaVersion:
          type: integer
          const: 1
          default: 1
      required:
      - deviceId
      - pet
    RegisterProfileResponse:
      type: object
      properties:
        deviceId:
          $ref: '#/components/schemas/DeviceId'
      required:
      - deviceId
    SnapshotUploadRequest:
      type: object
      properties:
        deviceId:
          $ref: '#/components/schemas/DeviceId'
        uploadId:
          type: string
          minLength: 1
        expectedServerRevision:
          anyOf:
          - type: integer
            format: int64
            minimum: 1
            description: Null only when the server has no snapshot. Otherwise the last known positive server revision.
          - type: 'null'
        gameRunId:
          type: string
          minLength: 1
        throughHistorySequence:
          type: integer
          format: int64
          minimum: 0
        currentContentFingerprint:
          type: string
          minLength: 1
        snapshotFormatVersion:
          type: integer
          minimum: 1
          maximum: 5
        checksum:
          type: string
          pattern: ^[a-f0-9]{64}$
        snapshotJson:
          type: string
          minLength: 1
          description: Exact HistoryCodec.encodeSnapshot output, opaque UTF-8 JSON string. No server reserialization.
            Contains state, complete ordered history and checksum.
        schemaVersion:
          type: integer
          const: 1
          default: 1
      required:
      - deviceId
      - uploadId
      - expectedServerRevision
      - gameRunId
      - throughHistorySequence
      - currentContentFingerprint
      - snapshotFormatVersion
      - checksum
      - snapshotJson
    SnapshotUploadResponse:
      type: object
      properties:
        uploadId:
          type: string
          minLength: 1
        gameRunId:
          type: string
          minLength: 1
        serverRevision:
          type: integer
          format: int64
          minimum: 1
        checksum:
          type: string
          pattern: ^[a-f0-9]{64}$
      required:
      - uploadId
      - gameRunId
      - serverRevision
      - checksum
    SnapshotDownloadResponse:
      type: object
      properties:
        gameRunId:
          type: string
          minLength: 1
        serverRevision:
          type: integer
          format: int64
          minimum: 1
        currentContentFingerprint:
          type: string
          minLength: 1
        snapshotJson:
          type: string
          minLength: 1
          description: Unmodified snapshotJson accepted by the server.
        schemaVersion:
          type: integer
          const: 1
          default: 1
      required:
      - gameRunId
      - serverRevision
      - currentContentFingerprint
      - snapshotJson
    BackendError:
      type: object
      properties:
        code:
          type: string
          minLength: 1
        message:
          anyOf:
          - type: string
          - type: 'null'
        requestId:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - code
    ParentRewardCoins:
      type: object
      properties:
        type:
          type: string
          const: COINS
        amount:
          type: integer
          format: int64
          minimum: 1
      required:
      - type
      - amount
      description: A grant of positive whole game coins. Not a replacement balance. Maximum amount policy remains
        to be agreed.
    ParentRewardAccessory:
      type: object
      properties:
        type:
          type: string
          const: ACCESSORY
        itemId:
          type: string
          minLength: 1
      required:
      - type
      - itemId
      description: Immutable ID of a server-permitted accessory from the game catalog. No automatic equip or cash
        conversion.
    ParentRewardPayload:
      oneOf:
      - $ref: '#/components/schemas/ParentRewardCoins'
      - $ref: '#/components/schemas/ParentRewardAccessory'
      discriminator:
        propertyName: type
        mapping:
          COINS: '#/components/schemas/ParentRewardCoins'
          ACCESSORY: '#/components/schemas/ParentRewardAccessory'
      description: Own discriminator type, separate from analytics _type.
    CreateParentRewardRequest:
      type: object
      properties:
        deviceId:
          $ref: '#/components/schemas/DeviceId'
        gameRunId:
          type: string
          minLength: 1
        reward:
          $ref: '#/components/schemas/ParentRewardPayload'
        schemaVersion:
          type: integer
          const: 1
          default: 1
      required:
      - deviceId
      - gameRunId
      - reward
    ParentRewardDto:
      type: object
      properties:
        rewardId:
          type: string
          minLength: 1
        profileId:
          $ref: '#/components/schemas/DeviceId'
          description: 'Compatibility field: exactly the request deviceId; not a separate account or identifier.'
        gameRunId:
          type: string
          minLength: 1
        sequence:
          type: integer
          format: int64
          minimum: 1
        reward:
          $ref: '#/components/schemas/ParentRewardPayload'
        createdAt:
          type: string
          format: date-time
          pattern: Z$
          description: UTC ISO 8601 issuance time ending in Z. Informational only, not expiry or an application day.
            Apply in the current local day/phase at commit; do not reopen FINISHED or rewrite closed decisions. Long
            offline periods do not invalidate the grant.
      required:
      - rewardId
      - profileId
      - gameRunId
      - sequence
      - reward
      - createdAt
    ParentRewardsResponse:
      type: object
      properties:
        profileId:
          $ref: '#/components/schemas/DeviceId'
          description: 'Compatibility field: exactly the request deviceId; not a separate account or identifier.'
        gameRunId:
          type: string
          minLength: 1
        rewards:
          type: array
          items:
            $ref: '#/components/schemas/ParentRewardDto'
        nextAfterSequence:
          type: integer
          format: int64
          minimum: 0
        hasMore:
          type: boolean
        schemaVersion:
          type: integer
          const: 1
          default: 1
      required:
      - profileId
      - gameRunId
      - rewards
      - nextAfterSequence
      - hasMore
      description: Append-only per-run stream including acknowledged grants. Entries strictly contiguous after request
        cursor. nextAfterSequence is only a page-fetch cursor, never proof of local application; it is last returned
        sequence, or input cursor for an empty page. Empty page cannot have hasMore=true. A durable watermark comes
        only from contiguous receipts in the current restored world.
    ParentRewardOutcome:
      type: string
      enum:
      - APPLIED
      - ALREADY_OWNED
      description: ALREADY_OWNED is only valid for accessory rewards; it does not convert the item to coins.
    ParentRewardReceiptDto:
      type: object
      properties:
        rewardId:
          type: string
          minLength: 1
        applicationId:
          type: string
          format: uuid
        historyEntryId:
          type: string
          minLength: 1
        historySequence:
          type: integer
          format: int64
          minimum: 1
        outcome:
          $ref: '#/components/schemas/ParentRewardOutcome'
      required:
      - rewardId
      - applicationId
      - historyEntryId
      - historySequence
      - outcome
      description: Transport ACK of a previously committed application. Durable local storage must additionally contain
        the complete immutable grant (profileId, gameRunId, rewardId, server sequence, reward payload, createdAt)
        in the same snapshot/audit transaction. Application ID differs from reward ID; old-snapshot restore may produce
        a new application. Already-applied replay returns the existing application ID.
    AckParentRewardsRequest:
      type: object
      properties:
        deviceId:
          $ref: '#/components/schemas/DeviceId'
        gameRunId:
          type: string
          minLength: 1
        receipts:
          type: array
          items:
            $ref: '#/components/schemas/ParentRewardReceiptDto'
          minItems: 1
          maxItems: 100
        schemaVersion:
          type: integer
          const: 1
          default: 1
      required:
      - deviceId
      - gameRunId
      - receipts
    AckParentRewardsResponse:
      type: object
      properties:
        gameRunId:
          type: string
          minLength: 1
        acceptedApplicationIds:
          type: array
          items:
            type: string
            format: uuid
        schemaVersion:
          type: integer
          const: 1
          default: 1
      required:
      - gameRunId
      - acceptedApplicationIds
      description: Delivery acknowledgement only. Never removes rewards or filters them out of replayable pull responses.
    DeviceId:
      type: string
      minLength: 1
      description: Saved AndroidID for new clients, or the unchanged UUID of a migrated legacy client. A nonblank
        string; do not require UUID format.
      examples:
      - 9f1c2d3e4a5b6078
      - 344b0765-7318-450f-9576-e3f50e393f38
    DeviceIdQrContent:
      type: string
      minLength: 1
      description: Exactly the saved deviceId as plain UTF-8 text. Generated offline, no JSON envelope, URL or expiry.
      examples:
      - 9f1c2d3e4a5b6078
    SnapshotDownloadRequest:
      type: object
      properties:
        deviceId:
          $ref: '#/components/schemas/DeviceId'
        schemaVersion:
          type: integer
          const: 1
          default: 1
      required:
      - deviceId
    SkillAssessmentsRequest:
